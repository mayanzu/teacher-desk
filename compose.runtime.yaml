services:
  timetable:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:alpine}
    image: teacher-timetable:latest
    container_name: timetable
    restart: unless-stopped
    depends_on:
      academic-sync:
        condition: service_healthy
    ports:
      - '8088:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  academic-sync:
    build:
      context: .
      dockerfile: Dockerfile.server
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    image: teacher-timetable-sync:latest
    container_name: teacher-timetable-sync
    restart: unless-stopped
    expose:
      - '8787'
    mem_limit: 256m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
